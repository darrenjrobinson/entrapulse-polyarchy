# Version-update PRs only. Dependabot *alerts* are a separate repository setting
# (Settings → Code security → Dependabot alerts) with no API to enable it.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # server, client, core and ext-apps move together; listed first because a
      # package joins the first group it matches.
      mcp-sdk:
        patterns: ["@modelcontextprotocol/*"]
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
